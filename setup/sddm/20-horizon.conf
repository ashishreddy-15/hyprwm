# SDDM drop-in, installed to /etc/sddm.conf.d/ by ~/hyprwm/setup/sddm.sh.
# Only switches the theme. The greeter compositor setup (sway, outputs,
# input) stays with ~/swaywm/setup/sddm (10-swaywm.conf); this file sorts
# after it and wins. Remove it to get the "mono" theme back.

[Theme]
Current=horizon
