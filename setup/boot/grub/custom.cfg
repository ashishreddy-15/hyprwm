# Horizon boot menu — installed by ~/hyprwm/setup/boot.sh
#
# Fedora's grub.cfg sources this file at the end (41_custom), so the theme
# needs no grub2-mkconfig and the boot entries are never regenerated.
# Delete this file (or run setup/boot.sh --uninstall) for the plain text menu.

set horizon="${config_directory}/themes/horizon"
if [ ! -f "$horizon/theme.txt" ]; then set horizon="$prefix/themes/horizon"; fi

if [ -f "$horizon/theme.txt" ]; then
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    loadfont "$horizon/maple-15.pf2"
    loadfont "$horizon/maple-17.pf2"
    loadfont "$horizon/maple-19.pf2"
    set gfxmode=1920x1200,auto
    set gfxpayload=keep
    # if the graphical terminal can't start, stay on the text menu
    if terminal_output gfxterm; then
        set theme="$horizon/theme.txt"
        export theme
    else
        terminal_output console
    fi
fi
