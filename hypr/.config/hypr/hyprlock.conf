# ── Lock screen (hyprlock) — Horizon ─────────────────────────
# The wallpaper as it is, the clock in the empty sky above the mountain,
# and the password field on the dark ground below the horizon: dots over
# a single thin line. Wrong password: red text. Caps Lock: amber text.
# Palette: ~/swaywm/colors.md. ('##' is a literal '#' in hyprlang.)

$fg     = rgb(e6e8e1)
$muted  = rgb(8c9384)
$dim    = rgb(5a6152)
$accent = rgb(6fa3b8)

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled   = true
    bezier    = out, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 2.5, out
    animation = fadeOut, 1, 1.5, out
    animation = inputFieldDots, 1, 1.5, out
}

background {
    monitor =
    path    = ~/.config/hypr/wallpaper.jpg
    color   = rgb(13160f)
    blur_passes = 0
}

# Clock, in the sky
label {
    monitor =
    text        = $TIME
    color       = $fg
    font_size   = 120
    font_family = Maple Mono ExtraLight
    position    = 0, -150
    halign      = center
    valign      = top
}

# Date, small and spaced
label {
    monitor =
    text        = cmd[update:60000] echo "<span letter_spacing='4000'>$(date '+%A %-d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color       = $muted
    font_size   = 13
    font_family = Maple Mono
    position    = 0, -340
    halign      = center
    valign      = top
}

# Password: dots, no box
input-field {
    monitor =
    size              = 320, 40
    outline_thickness = 0
    rounding          = 0
    inner_color       = rgba(00000000)
    outer_color       = rgba(00000000)
    check_color       = rgba(00000000)
    fail_color        = rgba(00000000)
    capslock_color    = rgba(00000000)
    font_color        = $fg
    font_family       = Maple Mono
    fade_on_empty     = false
    placeholder_text  = <span foreground="##5a6152">type to unlock</span>
    fail_text         = <span foreground="##e05555">$PAMFAIL</span>
    dots_size         = 0.22
    dots_spacing      = 0.6
    dots_center       = true
    position          = 0, -260
    halign            = center
    valign            = center
}

# The horizon line under the password
shape {
    monitor =
    size         = 320, 1
    color        = rgba(6fa3b8bb)
    rounding     = 0
    border_size  = 0
    position     = 0, -282
    halign       = center
    valign       = center
}

# Caps Lock warning
label {
    monitor =
    text        = cmd[update:500] [ "$(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | sort -r | head -1)" = 1 ] && echo "<span foreground='##db892d'>CAPS LOCK</span>" || echo ""
    font_size   = 10
    font_family = Maple Mono
    position    = 0, -310
    halign      = center
    valign      = center
}
