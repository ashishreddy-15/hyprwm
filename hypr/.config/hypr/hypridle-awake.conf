# ── Idle while "keep awake" is on ────────────────────────────
# No auto-lock, screen-off or suspend, but still locks before sleep and on
# `loginctl lock-session`, so closing the lid never leaves it unlocked.

general {
    lock_cmd         = $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
