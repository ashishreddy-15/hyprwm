# ── Idle (hypridle) ──────────────────────────────────────────
# Same timeline as Sway's idle.sh:
#   5 min idle    → lock (scripts/lock.sh: Quickshell, hyprlock as fallback)
#   10 min idle   → displays off
#   15 min idle   → suspend, only when running on battery
#   already locked + 30 s → displays off
# Keep awake (scripts/keep-awake.sh) swaps this for hypridle-awake.conf.
# Started by keep-awake.sh; manual lock: Super+Shift+Escape or `loginctl lock-session`.

general {
    lock_cmd         = $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout    = 30
    on-timeout = $HOME/.config/hypr/scripts/lock.sh status && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout    = 900
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 1 ] || systemctl suspend
}
