# ── kitty (Hyprland session) ─────────────────────────────────
# Same font, padding and colours as foot in the Sway session.
# Palette: horizon.conf (from ~/swaywm/colors.md). Reload: Ctrl+Shift+F5.

font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# foot pad=10x5 → 5 px top/bottom, 10 px left/right
window_padding_width 5 10
placement_strategy   top-left

cursor_shape          beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 15
cursor_trail          0

scrollback_lines 10000
mouse_hide_wait  2.0
copy_on_select   no
strip_trailing_spaces smart
url_style        curly
detect_urls      yes

enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes

confirm_os_window_close 0
remember_window_size    no
update_check_interval   0
shell_integration       enabled

# Tabs (Ctrl+Shift+T): a quiet strip at the bottom, only when there are 2+
tab_bar_edge         bottom
tab_bar_style        separator
tab_separator        "  "
tab_bar_min_tabs     2
tab_title_template   " {index} {title} "
active_tab_font_style   normal
inactive_tab_font_style normal

include horizon.conf
